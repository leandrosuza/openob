version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: openob_postgres
    environment:
      POSTGRES_DB: openob
      POSTGRES_USER: openob_user
      POSTGRES_PASSWORD: openob_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openob_user -d openob"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
